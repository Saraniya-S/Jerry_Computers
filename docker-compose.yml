# Local development services: `npm run services:up`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jerry
      POSTGRES_PASSWORD: jerry
      POSTGRES_DB: jerry_computers
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jerry -d jerry_computers"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the app sends in development; inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
