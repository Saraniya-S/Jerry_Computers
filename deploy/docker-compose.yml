# Production database for the VPS. Only the app on this server can reach it (127.0.0.1).
#   docker compose -f deploy/docker-compose.yml --env-file .env.local up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jerry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: jerry_computers
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jerry -d jerry_computers"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
